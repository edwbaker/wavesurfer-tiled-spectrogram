<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wavesurfer-tiled-spectrogram demo</title>
<link rel="icon" href="data:,">
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1.5rem; max-width: 1000px; color: #222; background: #fff; }
  h1 { font-size: 1.3rem; }
  fieldset { border: 1px solid #ccc; margin: 0 0 1rem; }
  label { margin-right: 1rem; }
  #player { border: 1px solid #ddd; }
  #status { font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; color: #555; }
  #player ::part(timeline-wrapper) { min-height: 20px; }
</style>
</head>
<body>
<h1>wavesurfer-tiled-spectrogram</h1>
<p>A spectrogram made in advance, shown from image tiles: only the tiles in view are fetched, at the
resolution the zoom needs. Choose what to show; the address bar remembers it. The plugin's source and
documentation are <a href="https://github.com/edwbaker/wavesurfer-tiled-spectrogram">on GitHub</a>.</p>
<form id="controls">
  <fieldset>
    <label>audioBLAST recording <input name="recording" size="20" placeholder="source/id"></label>
    or <label>audio <input name="audio" size="40"></label>
    <label>and tiles <input name="tiles" size="30"></label>
  </fieldset>
  <fieldset>
    <label><input type="radio" name="mode" value="preview"> Tiles until the Spectrogram plugin is ready</label>
    <label><input type="radio" name="mode" value="tiles"> Tiles only</label>
    <label><input type="radio" name="mode" value="stream"> Tiles only, audio streamed with the peaks</label>
    <label><input type="radio" name="mode" value="builtin"> Spectrogram plugin only</label>
  </fieldset>
  <fieldset>
    <label>wavesurfer.js <select name="ws"><option value="7">7.10.1</option><option value="8">8.0.2</option></select></label>
    <label>Colours <select name="colorMap"><option value="gray">gray</option><option value="igray">igray</option><option value="heat">a list of 256 (heat)</option></select></label>
    <label>Rows <input name="rows" type="number" value="120" min="20" max="512"></label>
    <label>Sample rate <input name="rate" type="number" value="44100"></label>
    <button>Load</button> <button type="button" id="play">Play / pause</button>
  </fieldset>
  <fieldset>
    <label>Zoom <input id="slider" type="range" min="0" max="300" disabled>
      <input name="zoom" type="number" min="1" max="1000" value="344"> pixels a second</label>
  </fieldset>
</form>
<div id="player"></div>
<p id="credit"></p>
<p id="status"></p>
<script>
  // Settings from the address bar, so that a view can be shared and reloaded
  const params = new URLSearchParams(location.search)
  const settings = {
    // A recording in audioBLAST, as source/id, brings its own audio, tiles and
    // sample rate; with none, the audio and tiles given are shown
    recording: params.has('recording') ? params.get('recording') : 'bio.acousti.ca/10015',
    audio: params.get('audio') || 'samples/demo.wav',
    tiles: params.get('tiles') || 'samples/demo/index.json',
    mode: params.get('mode') || 'preview',
    ws: params.get('ws') || '8',
    colorMap: params.get('colorMap') || 'gray',
    rows: Number(params.get('rows') || 120),
    rate: Number(params.get('rate') || 44100),
    zoom: Number(params.get('zoom') || 344),
  }
  const form = document.getElementById('controls')
  for (const [name, value] of Object.entries(settings)) {
    const field = form.elements[name]
    if (field instanceof RadioNodeList) field.value = value; else field.value = value
  }
  // wavesurfer.js and its plugins from cdn.audioblast.org, so that the demo
  // runs the same here and on GitHub Pages
  const base = 'https://cdn.audioblast.org/wavesurfer/' + (settings.ws === '7' ? '7.10.1' : '8.0.2') + '/'
  const scripts = [base + 'wavesurfer.min.js', base + 'plugins/timeline.min.js', base + 'plugins/regions.min.js',
                   base + 'plugins/spectrogram.min.js', '../dist/tiled-spectrogram.min.js']
  function load(i) {
    if (i === scripts.length) return start()
    const s = document.createElement('script')
    s.src = scripts[i]
    s.onload = () => load(i + 1)
    document.head.appendChild(s)
  }
  load(0)

  const status = document.getElementById('status')
  function say(line) { status.textContent += line + '\n' }

  // The demo's own list of 256 colours, from quiet to loud, to show that any
  // will do: black through red and yellow to white
  function heat() {
    return Array.from({ length: 256 }, (_, i) => {
      const t = i / 255
      return [Math.min(1, 3 * t), Math.min(1, Math.max(0, 3 * t - 1)), Math.max(0, 3 * t - 2), 1]
    })
  }

  // A recording in audioBLAST, with the addresses of its audio and tiles, its
  // sample rate and whom to credit
  async function lookUp(recording) {
    const cut = recording.indexOf('/')
    if (cut < 1) throw new Error('give the audioBLAST recording as source/id')
    const query = new URLSearchParams({ output: 'JSON', source: recording.slice(0, cut), id: recording.slice(cut + 1) })
    const response = await fetch('https://api.audioblast.org/data/recordings/?' + query)
    if (!response.ok) throw new Error('audioBLAST could not be asked: ' + response.status)
    const found = (await response.json()).data[0]
    if (!found) throw new Error('audioBLAST has no recording ' + recording)
    if (!found.spectrogram_url) throw new Error('audioBLAST has no tiles of ' + recording)
    return found
  }

  // The recording's credit, as its licence asks
  function credit(found) {
    const link = (href, text) => {
      if (!href) return text
      const a = document.createElement('a')
      a.href = href
      a.textContent = text
      return a
    }
    const cc = /creativecommons\.org\/licenses\/([a-z-]+)\/([\d.]+)/.exec(found.license)
    const parts = ['Recording ', link(found.info_url, found.source + ' ' + found.id)]
    if (found.taxon) parts.push(': ', Object.assign(document.createElement('i'), { textContent: found.taxon }))
    if (found.author) parts.push(', by ' + found.author)
    if (found.rights_holder) parts.push(', © ' + found.rights_holder)
    parts.push(', ', found.license ? link(found.license, cc ? 'CC ' + cc[1].toUpperCase() + ' ' + cc[2] : 'licence') : 'licence unknown', '.')
    document.getElementById('credit').append(...parts)
  }

  async function start() {
    const t0 = performance.now()
    const ms = () => Math.round(performance.now() - t0) + ' ms'
    if (settings.recording) {
      let found
      try {
        found = await lookUp(settings.recording)
      } catch (error) {
        say(ms() + ' ' + error.message)
        return
      }
      Object.assign(settings, { audio: found.filename, tiles: found.spectrogram_url, rate: Number(found.sample_rate) || settings.rate })
      for (const name of ['audio', 'tiles', 'rate']) form.elements[name].value = settings[name]
      credit(found)
      say(ms() + ' found in audioBLAST: ' + found.duration + ' s at ' + found.sample_rate + ' Hz')
    }
    const plugins = [WaveSurfer.Timeline.create({ height: 20 }), WaveSurfer.Regions.create()]
    // Both plugins are given the same colours, so that they look the same
    const colorMap = settings.colorMap === 'heat' ? heat() : settings.colorMap
    let tiles = null
    let spectrogram = null
    if (settings.mode !== 'builtin') {
      tiles = WaveSurfer.TiledSpectrogram.create({ url: settings.tiles, height: settings.rows, colorMap: colorMap })
      plugins.push(tiles)
    }
    const stream = settings.mode === 'stream'
    if (settings.mode !== 'tiles' && !stream) {
      spectrogram = WaveSurfer.Spectrogram.create({
        // As the tiles from make-tiles.sh's defaults; gainDB and rangeDB are the plugin's own
        labels: false, height: settings.rows, scale: 'linear', colorMap: colorMap, useWebWorker: true,
      })
      plugins.push(spectrogram)
    }
    const ws = WaveSurfer.create({
      container: '#player', height: 128, minPxPerSec: settings.zoom, normalize: true, sampleRate: settings.rate,
      waveColor: '#000', progressColor: '#52b788', url: stream ? undefined : settings.audio, plugins: plugins,
    })
    if (tiles) {
      const perSecond = (level) => level.columnsPerSecond.toFixed(1) + ' columns a second'
      tiles.on('load', (m) => say(ms() + ' manifest: ' + m.levels.length + ' levels, of ' +
        m.levels.map((level) => level.tileCount + (level.tileCount === 1 ? ' tile' : ' tiles') + ' at ' + perSecond(level)).join(' and ') + '; up to ' + m.frequencyMax + ' Hz'))
      tiles.on('level', (level) => say(ms() + ' showing the level at ' + perSecond(level)))
      tiles.on('tileload', (index, level) => say(ms() + ' tile ' + index + ' at ' + perSecond(level)))
      tiles.on('ready', () => say(ms() + ' tiles in view drawn'))
      tiles.on('error', (e) => say(ms() + ' tiles: ' + e.message))
      tiles.on('handover', () => say(ms() + ' tiles handed over'))
      if (spectrogram) tiles.handOver(spectrogram)
    }
    if (stream) {
      // Nothing decoded: the waveform is drawn from the peaks beside the tiles,
      // and the audio streams as it plays. wavesurfer.js draws the same peaks at
      // every zoom, so they are chosen for the zoom it starts at, as wide as the
      // player at least.
      tiles.on('load', async (m) => {
        const drawn = Math.max(settings.zoom, document.getElementById('player').clientWidth / m.duration)
        const entry = WaveSurfer.TiledSpectrogram.choosePeaks(m, drawn)
        if (!entry) { say(ms() + ' the manifest lists no peaks'); return }
        say(ms() + ' peaks at ' + entry.pointsPerSecond.toFixed(1) + ' points a second, for ' + drawn.toFixed(1) + ' pixels a second')
        const peaks = await (await fetch(WaveSurfer.TiledSpectrogram.peaksUrl(entry, new URL(settings.tiles, location.href).href))).json()
        ws.load(settings.audio, [peaks.data.map((v) => v / (peaks.bits === 8 ? 128 : 32768))], m.duration)
      })
    }
    if (spectrogram) spectrogram.on('ready', () => say(ms() + ' Spectrogram plugin ready'))
    // Zooming, from 1 to 1000 pixels a second on a slider that runs in powers
    // of ten, or as typed; until the audio is ready the zoom is the one to start at
    const slider = document.getElementById('slider')
    const zoomField = form.elements.zoom
    const zoom = (pixelsPerSecond) => {
      zoomField.value = pixelsPerSecond
      slider.value = Math.round(100 * Math.log10(pixelsPerSecond))
      if (!slider.disabled) ws.zoom(pixelsPerSecond)
    }
    slider.value = Math.round(100 * Math.log10(settings.zoom))
    slider.oninput = () => zoom(Math.round(10 ** (slider.value / 100)))
    zoomField.onchange = () => { if (zoomField.value >= 1) zoom(Number(zoomField.value)) }
    ws.on('ready', () => {
      say(ms() + (stream ? ' waveform drawn from the peaks: ' : ' audio decoded: ') + ws.getDuration().toFixed(3) + ' s')
      plugins[1].addRegion({ start: 1, end: 2, color: 'rgba(82,183,136,0.25)' })
      slider.disabled = false
    })
    document.getElementById('play').onclick = () => ws.playPause()
    // For checking from the console
    Object.assign(window, { ws: ws, tiles: tiles, spectrogram: spectrogram })
  }
</script>
</body>
</html>
