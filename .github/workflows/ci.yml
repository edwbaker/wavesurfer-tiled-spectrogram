name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: make-tiles.sh makes tiles and peaks at two levels, in a manifest the plugin takes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -f lavfi -i "sine=frequency=5000:sample_rate=44100:duration=70" test.wav
          bash tools/make-tiles.sh test.wav out
          test -f out/512/0.jpg && test -f out/512/1.jpg && test -f out/2048/0.jpg
          test -f out/peaks-512.json && test -f out/peaks-2048.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { normaliseManifest } from './src/manifest.js'
            const m = normaliseManifest(JSON.parse(readFileSync('out/index.json', 'utf8')))
            const counts = m.levels.map((level) => level.tileCount).join()
            if (counts !== '2,1' || m.peaks.length !== 2) { console.error(counts, m.peaks); process.exit(1) }
          "
