name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: make-tiles.sh makes tiles and peaks at two levels, in a manifest the plugin takes
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -v error -f lavfi -i "sine=frequency=5000:sample_rate=44100:duration=70" test.wav
          bash tools/make-tiles.sh test.wav out
          test -f out/512/0.jpg && test -f out/512/1.jpg && test -f out/2048/0.jpg
          test -f out/peaks-512.json && test -f out/peaks-2048.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { normaliseManifest } from './src/manifest.js'
            const m = normaliseManifest(JSON.parse(readFileSync('out/index.json', 'utf8')))
            const counts = m.levels.map((level) => level.tileCount).join()
            if (counts !== '2,1' || m.peaks.length !== 2) { console.error(counts, m.peaks); process.exit(1) }
          "
      - name: above 96 kHz the finest level is four times finer, in 15-second tiles
        run: |
          ffmpeg -v error -f lavfi -i "sine=frequency=40000:sample_rate=200000:duration=20" ultra.wav
          bash tools/make-tiles.sh ultra.wav ultra
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            import { normaliseManifest } from './src/manifest.js'
            const m = normaliseManifest(JSON.parse(readFileSync('ultra/index.json', 'utf8')))
            const [fine, next] = m.levels
            const ok = m.levels.length === 2 && fine.tileCount === 2 && Math.abs(fine.tileDuration - 15) < 0.1 &&
              fine.columnsPerSecond > 340 && Math.abs(next.columnsPerSecond - 86) < 1 && next.samplesPerColumn === 4 * fine.samplesPerColumn
            if (!ok) { console.error(m.levels); process.exit(1) }
          "
